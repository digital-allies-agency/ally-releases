# Ally – Dienste einer Neu-Installation (Installationspaket, Fassung 1.0). Wird von installieren.sh nach /opt/ally kopiert.
# Alle Werte kommen aus /opt/ally/.env (vom Installationsskript erzeugt, nur root lesbar). Hier stehen keine Geheimnisse.
# Feste Versionen (Stand 01.11.2026): traefik 3.7.15, n8n 2.42.7 (wie die Quell-Installation), PostgreSQL 16.10, Gotenberg 8.30.1,
# Synapse v1.162.0, Element v1.12.30; Chat-Bot aus server/matrix-bot (vor Ort gebaut). Wechsel einer Version nur mit einem eigenen Befehl je Server (Konzept F.3).
# Adressen: ${ALLY_HOST} = Oberfläche, ${CHAT_HOST} = Chat (Synapse + Element), ${N8N_HOST} = n8n (Editor, Webhooks).
# $$ ist die Schreibweise von docker compose für ein einzelnes $.
name: ally

services:
  traefik:
    image: traefik:3.7.15
    restart: always
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.mytlschallenge.acme.tlschallenge=true
      - --certificatesresolvers.mytlschallenge.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt

  postgres:
    image: postgres:16.10
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C.UTF-8
      - TZ=Europe/Berlin
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.7
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"   # von außen nur über traefik
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_PROXY_HOPS=1
      - WEBHOOK_URL=https://${N8N_HOST}/
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - ./n8n:/home/node/.n8n
      - ./dateien:/files          # Server-Ordner für SPEICHER 1 (Ablage „Server“)
      - ./import:/import          # nur während der Installation befüllt, danach leer
    labels:
      - traefik.enable=true
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      # Editor erst erreichbar, wenn installieren.sh das n8n-Konto lokal angelegt hat (setzt dann N8N_ROUTER_HOST in .env); vorher Host .invalid = gesperrt
      - traefik.http.routers.n8n.rule=Host(`${N8N_ROUTER_HOST:-n8n-gesperrt.invalid}`)
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
      - traefik.http.routers.n8n.service=n8n
      - traefik.http.routers.n8n.middlewares=ally-sicher@docker
      # Oberfläche (wie server/traefik-oberflaeche.labels.yml): / -> /webhook/app, /<pfad> -> /webhook/app/<pfad>, /webhook/... direkt
      - traefik.http.middlewares.ally-sicher.headers.stsSeconds=31536000
      - traefik.http.middlewares.ally-sicher.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.ally-sicher.headers.contentTypeNosniff=true
      - traefik.http.middlewares.oberflaeche-kopf.headers.customrequestheaders.X-Oberflaeche-Basis=/
      - "traefik.http.middlewares.oberflaeche-kopf.headers.customresponseheaders.Content-Security-Policy=default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; manifest-src 'self'; form-action 'self' https:; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"
      - traefik.http.middlewares.oberflaeche-gzip.compress=true
      - traefik.http.middlewares.oberflaeche-start.replacepath.path=/webhook/app
      - traefik.http.middlewares.oberflaeche-pfad.replacepathregex.regex=^/(aktion|datei|manifest|symbol|kalender|stil|skript|logo|shopify|shopify-rueckruf|shopify-bericht|neu|api|mediakit)$$
      - traefik.http.middlewares.oberflaeche-pfad.replacepathregex.replacement=/webhook/app/$${1}
      - traefik.http.middlewares.oberflaeche-umleitung.redirectregex.regex=^https://[^/]+/webhook/app([?].*)?$$
      - traefik.http.middlewares.oberflaeche-umleitung.redirectregex.replacement=https://${ALLY_HOST}/$${1}
      - traefik.http.routers.oberflaeche-start.rule=Host(`${ALLY_HOST}`) && Path(`/`)
      - traefik.http.routers.oberflaeche-start.entrypoints=websecure
      - traefik.http.routers.oberflaeche-start.tls=true
      - traefik.http.routers.oberflaeche-start.tls.certresolver=mytlschallenge
      - traefik.http.routers.oberflaeche-start.service=n8n
      - traefik.http.routers.oberflaeche-start.priority=300
      - traefik.http.routers.oberflaeche-start.middlewares=ally-sicher@docker,oberflaeche-kopf@docker,oberflaeche-gzip@docker,oberflaeche-start@docker
      - traefik.http.routers.oberflaeche.rule=Host(`${ALLY_HOST}`) && PathRegexp(`^/(aktion|datei|manifest|symbol|kalender|stil|skript|logo|shopify|shopify-rueckruf|shopify-bericht|neu|api|mediakit)$$`)
      - traefik.http.routers.oberflaeche.entrypoints=websecure
      - traefik.http.routers.oberflaeche.tls=true
      - traefik.http.routers.oberflaeche.tls.certresolver=mytlschallenge
      - traefik.http.routers.oberflaeche.service=n8n
      - traefik.http.routers.oberflaeche.priority=300
      - traefik.http.routers.oberflaeche.middlewares=ally-sicher@docker,oberflaeche-kopf@docker,oberflaeche-gzip@docker,oberflaeche-pfad@docker
      - traefik.http.routers.oberflaeche-alt.rule=(Host(`${ALLY_HOST}`) || Host(`${N8N_HOST}`)) && Path(`/webhook/app`) && Method(`GET`)
      - traefik.http.routers.oberflaeche-alt.entrypoints=websecure
      - traefik.http.routers.oberflaeche-alt.tls=true
      - traefik.http.routers.oberflaeche-alt.tls.certresolver=mytlschallenge
      - traefik.http.routers.oberflaeche-alt.service=n8n
      - traefik.http.routers.oberflaeche-alt.priority=300
      - traefik.http.routers.oberflaeche-alt.middlewares=ally-sicher@docker,oberflaeche-umleitung@docker
      # Webhooks (web/…, app/…) auch unter der Adresse der Oberfläche; der n8n-Editor ist dort nicht erreichbar
      - traefik.http.routers.oberflaeche-webhook.rule=Host(`${ALLY_HOST}`) && PathPrefix(`/webhook/`)
      - traefik.http.routers.oberflaeche-webhook.entrypoints=websecure
      - traefik.http.routers.oberflaeche-webhook.tls=true
      - traefik.http.routers.oberflaeche-webhook.tls.certresolver=mytlschallenge
      - traefik.http.routers.oberflaeche-webhook.service=n8n
      - traefik.http.routers.oberflaeche-webhook.priority=200
      - traefik.http.routers.oberflaeche-webhook.middlewares=ally-sicher@docker,oberflaeche-gzip@docker

  ally-render:
    # PDF-Dienst (Gotenberg) für Berichte; nur im Docker-Netz, intern http://ally-render:3000
    image: gotenberg/gotenberg:8.30.1
    restart: always

  synapse:
    image: matrixdotorg/synapse:v1.162.0
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
      - TZ=Europe/Berlin
    volumes:
      - ./synapse:/data
    labels:
      - traefik.enable=true
      - traefik.http.services.synapse.loadbalancer.server.port=8008
      - traefik.http.routers.synapse.rule=Host(`${CHAT_HOST}`) && (PathPrefix(`/_matrix`) || PathPrefix(`/_synapse/client`))
      - traefik.http.routers.synapse.entrypoints=websecure
      - traefik.http.routers.synapse.tls=true
      - traefik.http.routers.synapse.tls.certresolver=mytlschallenge
      - traefik.http.routers.synapse.service=synapse
      - traefik.http.routers.synapse.priority=200
      # Admin-Bereich von außen gesperrt (wie server/synapse-admin-sperre.labels.yml); n8n (ALLY 18) nutzt intern http://synapse:8008
      - traefik.http.middlewares.synapse-admin-sperre.ipallowlist.sourcerange=127.0.0.1/32
      - traefik.http.routers.synapse-admin.rule=Host(`${CHAT_HOST}`) && PathPrefix(`/_synapse/admin`)
      - traefik.http.routers.synapse-admin.entrypoints=websecure
      - traefik.http.routers.synapse-admin.tls=true
      - traefik.http.routers.synapse-admin.tls.certresolver=mytlschallenge
      - traefik.http.routers.synapse-admin.service=synapse
      - traefik.http.routers.synapse-admin.priority=250
      - traefik.http.routers.synapse-admin.middlewares=synapse-admin-sperre@docker

  element:
    # Chat im Browser unter https://${CHAT_HOST}/ (Element Web), fest auf den eigenen Chat-Server eingestellt
    image: vectorim/element-web:v1.12.30
    restart: always
    volumes:
      - ./element/config.json:/app/config.json:ro
    labels:
      - traefik.enable=true
      - traefik.http.services.element.loadbalancer.server.port=80
      - traefik.http.routers.element.rule=Host(`${CHAT_HOST}`)
      - traefik.http.routers.element.entrypoints=websecure
      - traefik.http.routers.element.tls=true
      - traefik.http.routers.element.tls.certresolver=mytlschallenge
      - traefik.http.routers.element.service=element
      - traefik.http.routers.element.priority=100
      - traefik.http.routers.element.middlewares=ally-sicher@docker

  ally-listener-bot:
    # Chat-Bot (Matrix-Listener, server/matrix-bot): leitet Chat-Nachrichten und -Dateien an n8n (ALLY 1, ALLY 3), sendet für n8n.
    # Containername fest wie in den Workflows (http://matrix-ally-listener-bot-1:8765, docs/neutralitaet.md). Werte in matrix-bot.env (nur root).
    build: ./matrix-bot
    image: ally-listener-bot:1.0
    container_name: matrix-ally-listener-bot-1
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ./matrix-bot/store:/app/store
    env_file:
      - ./matrix-bot.env
